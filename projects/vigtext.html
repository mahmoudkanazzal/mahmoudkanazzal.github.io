<body>
<title>ViGText Fake Detection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one wide stage. Image on the left, explanations in the middle, graph on the right; a four-step rail on top. */
:root {
  color-scheme: dark;
  --bg: #1e2124; --fg: #f2f2f2; --muted: #aeb3ba; --card: #262a2f; --line: #41464d; --edge: #6e757e;
  --blue: #4a86d6; --orange: #d97a3a; --green: #4bb578; --purple: #9a78e0; --alert: #dc5a5a; --gold: #c9973f;
  --slate: #6f7884; --slate-deep: #4b525c;
  --f-display: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, sans-serif;
}

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.eyebrow { font: 700 13px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin: 0 0 8px; }
h1 { font: 700 clamp(28px, 4.2vw, 42px)/1.05 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }

.acts { display: flex; gap: 28px; }
.act { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.tab { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--muted);
  font: 700 13px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.act.on .tab { color: var(--c); }
.act.on .tab::before { background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
.tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 4px; }
.act.on .step .bar i { background: var(--c); }
.rail { display: grid; gap: 8px; }
.step { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--muted);
  font: 400 14px/1.25 var(--f-body); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.step .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.step .bar i { display: block; height: 100%; width: 0; background: var(--fg); border-radius: 4px; }
.step .lbl { display: flex; gap: 8px; align-items: baseline; }
.step b { font: 700 13px var(--f-mono); }
.step.on { color: var(--fg); }
.step:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 4px; }
@media (max-width: 560px) { .step .txt { display: none; } }

.caption { font: 400 clamp(17px, 2.3vw, 21px)/1.35 var(--f-display); min-height: 2.7em; margin: 0; max-width: 72ch; }
.stage { overflow-x: auto; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
svg { display: block; width: 100%; min-width: 640px; height: auto; }

.ctl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px;
  padding: 8px 16px; font: 700 14px var(--f-body); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, #scrub:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#scrub { flex: 1 1 200px; accent-color: var(--blue); min-width: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* SVG text styles */
.t-mono { font-family: var(--f-mono); font-weight: 700; }
.t-body { font-family: var(--f-body); }
.t-disp { font-family: var(--f-display); font-weight: 700; }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">ViGText</p>
      <h1>How ViGText tells real images from fake</h1>
    </div>
  </header>

  <div class="acts" id="acts"></div>
  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="stage"><svg id="svg" viewBox="0 76 1120 462" role="img" aria-label="Animation in two parts. The problem: a deepfake kitchen image from a customized generator passes an image-only detector and a caption-based detector as real, because neither looks at its small, local flaws. The solution: the image is divided into a 4 by 4 grid of labeled squares. A vision-language model writes explanations that point to specific squares. Squares become image nodes linked to their neighbors, and each explanation becomes a small word graph linked to the squares it describes, forming one composite graph. A graph neural network reads the composite graph and outputs a verdict: fake."></svg></div>

  <div class="ctl">
    <button class="btn" id="play" type="button">Pause</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <input type="range" id="scrub" min="0" max="30.8" step="0.01" value="0" aria-label="Timeline">
  </div>
</div>

  A.stages.forEach((s, i) => {

    const b = document.createElement("button");
    b.className = "step"; b.type = "button";
    b.innerHTML = `<span class="bar"><i></i></span><span class="lbl"><b>${i + 1}</b><span class="txt">${s.name}</span></span>`;
    b.setAttribute("aria-label", `${A.name}, step ${i + 1}: ${s.name}`);
    b.addEventListener("click", () => { t = g0 + .01; });
    rail.appendChild(b);
    ALL.push({ t: g0, end: g1, cap: s.cap, b });
  });
  A.box = box; actsEl.appendChild(box);
});
const caption = document.getElementById("caption");
function renderUI(tt) {
  let si = 0; ALL.forEach((s, i) => { if (tt >= s.t) si = i; });
  ALL.forEach((s, i) => { s.b.querySelector("i").style.width = (raw(tt, s.t, s.end) * 100) + "%"; s.b.classList.toggle("on", i === si); });
  if (caption.dataset.i !== String(si)) { caption.dataset.i = si; caption.textContent = ALL[si].cap; }
  ACTS[0].box.classList.toggle("on", tt < PL);
  ACTS[1].box.classList.toggle("on", tt >= PL);
}
function render(tt) {
  renderUI(tt);
  renderP(tt);
  renderS(Math.max(0, tt - PL));
  if (tt < PL) root.style.opacity = 0;
}

/* ---------- act 2: ViGText ---------- */
function renderS(t) {
  root.style.opacity = 1 - raw(t, END, LOOP);

  /* ghost + grid */
  L.ghost.style.opacity = .3 * seg(t, 6.8, 7.6);
  axis.style.opacity = seg(t, 0.9, 1.5);

  /* 3D projection of the graph */
  const th = 0.42 * Math.sin(t * 2 * Math.PI / 8.6), ph = 0.42, F = 820;
  const cth = Math.cos(th), sth = Math.sin(th), cph = Math.cos(ph), sph = Math.sin(ph);
  const proj = (X, Y, Z) => {
    const xr = X * cth + Z * sth, zr = -X * sth + Z * cth;
    const yr = Y * cph - zr * sph, zz = Y * sph + zr * cph;
    const k = F / (F - zz);
    return [GX + xr * k, GY + 10 + yr * k, k, zz];
  };
  const LAT = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) LAT.push(proj((c - 1.5) * SP, (r - 1.5) * SP, 0));
  const PIL = EXPL.map(e => proj(e.pill[0] - GX, e.pill[1] - GY, 56));
  const WP = EXPL.map(e => WOFF.map(([ox, oy]) => proj(e.pill[0] - GX + ox, e.pill[1] - GY + oy, 56)));
  const PP = key => key[0] === "n" ? LAT[key[2] * 4 + key[1]] : WP[key[1]][key[2]];
  const PE = 1.5 * SP + 52;
  const corners = [[-PE, -PE], [PE, -PE], [PE, PE], [-PE, PE]].map(([X, Y]) => proj(X, Y, -8));
  const cornersLow = [[-PE, -PE], [PE, -PE], [PE, PE], [-PE, PE]].map(([X, Y]) => proj(X, Y, -20));
  const poly = cs => "M " + cs.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L ") + " Z";
  plat.setAttribute("d", poly(corners));
  { const fi = cornersLow.reduce((b, q, i) => q[1] > cornersLow[b][1] ? i : b, 0);
    const a = (fi + 3) % 4, b = (fi + 1) % 4;
    platEdge.setAttribute("d", `M ${corners[a][0]} ${corners[a][1]} L ${corners[fi][0]} ${corners[fi][1]} L ${corners[b][0]} ${corners[b][1]} L ${cornersLow[b][0]} ${cornersLow[b][1]} L ${cornersLow[fi][0]} ${cornersLow[fi][1]} L ${cornersLow[a][0]} ${cornersLow[a][1]} Z`); }
  const po = seg(t, 6.9, 7.6);
  plat.style.opacity = .7 * po; platEdge.style.opacity = .55 * po;

  /* tiles */
  const appear = out(raw(t, 0, 0.8));
  const gap = 5 * seg(t, 0.9, 1.6) * (1 - seg(t, 6.5, 6.95));
  tiles.forEach(T => {
    const f = io(raw(t, 7.0 + T.i * 0.07, 8.0 + T.i * 0.07));
    const sx = IX + T.c * CELL + (T.c - 1.5) * gap, sy = IY + T.r * CELL + (T.r - 1.5) * gap;
    const P = LAT[T.i];
    const ex = P[0] - NR * P[2], ey = P[1] - NR * P[2];
    const s0 = lerp(.92, 1, appear), s = lerp(s0, (2 * NR * P[2]) / CELL, f);
    const x = lerp(sx, ex, f) + (1 - s0) * CELL / 2;
    const y = lerp(sy, ey, f) - 70 * Math.sin(Math.PI * f) + (1 - s0) * CELL / 2;
    const flip = f > 0 && f < 1 ? Math.max(Math.abs(Math.cos(Math.PI * f)), .06) : 1;
    const half = CELL * s / 2;
    T.g.setAttribute("transform", `translate(${(x + half).toFixed(2)} ${(y + half).toFixed(2)}) scale(${(s * flip).toFixed(4)} ${s.toFixed(4)}) translate(${-CELL / 2} ${-CELL / 2})`);
    T.halo.setAttribute("cx", P[0]); T.halo.setAttribute("cy", P[1]);
    T.lbl.setAttribute("x", P[0]); T.lbl.setAttribute("y", P[1] + (NR + 13) * P[2]);
    T.g.style.opacity = appear;
    const rx = lerp(gap ? 4 : 0, CELL / 2, f);
    T.cr.setAttribute("rx", rx); T.ring.setAttribute("rx", rx);
    T.ring.style.strokeWidth = 3 * f;
    T.lbl.style.opacity = 0;
    /* halo during message passing */
    const w = seg(t, 11.6, 12.0) * (1 - seg(t, 13.4, 13.8));
    const hp = Math.sin((t - 11.6) * 5 - (T.c + T.r) * 0.9);
    T.halo.style.opacity = w * (0.12 + 0.18 * (hp * .5 + .5));
    T.halo.setAttribute("r", (NR + 5 + 5 * (hp * .5 + .5)) * P[2]);
  });

  /* scan beam */
  const bw = seg(t, 2.6, 3.0) * (1 - seg(t, 6.4, 6.9));
  L.beam.style.opacity = bw;
  const bp = ((t - 2.6) / 1.2) % 1;
  beam.setAttribute("x", IX - 46 + (ISZ + 46) * (bp < 0 ? 0 : bp));

  /* VLM header */
  const vh = seg(t, 2.5, 2.9) * (1 - seg(t, 8.8, 9.3));
  vlm.style.opacity = vh;
  vlmDot.style.opacity = (t > 2.6 && t < 6.8) ? (0.35 + 0.65 * (Math.sin(t * 9) * .5 + .5)) : 1;

  /* explanation cards, highlights, connectors, pills */
  EXPL.forEach((e, i) => {
    const s = CARD_T[i];
    const a = raw(t, s, s + 0.55);
    const fly = io(raw(t, FLY_T[i], FLY_T[i] + 0.7));
    const PPi = PIL[i];
    const cx = lerp(MX + 30 * (1 - back(a)), PPi[0] - MW * 0.12, fly);
    const cy = lerp(CARD_Y[i], PPi[1] - CARD_H * 0.12, fly);
    const sc = lerp(1, 0.24, fly);
    e.card.setAttribute("transform", `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) scale(${sc.toFixed(4)})`);
    e.card.style.opacity = clamp(a * 2) * (1 - raw(t, FLY_T[i] + 0.35, FLY_T[i] + 0.7));
    const typed = clamp((t - s - 0.3) / 1.0);
    const full = e.lines[0].length + e.lines[1].length;
    const n = Math.floor(full * typed);
    e.l1.textContent = e.lines[0].slice(0, Math.min(n, e.lines[0].length));
    e.l2.textContent = e.lines[1].slice(0, Math.max(0, n - e.lines[0].length));
    const h = seg(t, s + 0.7, s + 1.1);
    e.rects.forEach(q => q.hr.setAttribute("transform", `translate(${((q.c - 1.5) * gap).toFixed(2)} ${((q.r - 1.5) * gap).toFixed(2)})`));
    e.hl.style.opacity = h * lerp(1, .75, seg(t, 9, 9.6));
    const cv = h * (1 - seg(t, FLY_T[i] - 0.3, FLY_T[i] + 0.1));
    e.conn.style.strokeDashoffset = 1 - cv;
    e.conn.style.opacity = cv > 0 ? 1 : 0;
    e.dot.style.opacity = cv;
    const pp = raw(t, FLY_T[i] + 0.5, FLY_T[i] + 0.95);
    const ps = pp ? back(pp) : 0;
    e.wordG.forEach((g, j) => {
      const q = raw(t, FLY_T[i] + 0.5 + j * 0.12, FLY_T[i] + 0.9 + j * 0.12);
      const P = WP[i][j];
      g.setAttribute("transform", `translate(${P[0].toFixed(1)} ${P[1].toFixed(1)}) scale(${((q ? back(q) : 0) * P[2]).toFixed(4)})`);
      g.style.opacity = clamp(q * 3);
    });
    const shp = proj(e.pill[0] - GX, e.pill[1] - GY, -8);
    pillSh[i].setAttribute("cx", shp[0]); pillSh[i].setAttribute("cy", shp[1]);
    pillSh[i].setAttribute("rx", 62 * shp[2] * ps); pillSh[i].setAttribute("ry", 14 * shp[2] * ps);
    pillSh[i].style.opacity = .16 * clamp(pp * 3);
  });

  /* edges */
  const pw = seg(t, 11.6, 12.0) * (1 - seg(t, 13.4, 13.8));
  edges.forEach(ed => {
    let d;
    if (ed.kind === "s") d = seg(t, 8.5 + ed.k * 0.03, 9.1 + ed.k * 0.03);
    else if (ed.kind === "ww") d = seg(t, FLY_T[ed.ei] + 0.85, FLY_T[ed.ei] + 1.15);
    else d = seg(t, FLY_T[ed.ei] + 1.0, FLY_T[ed.ei] + 1.5);
    const A = PP(ed.a), B = PP(ed.b);
    ed.line.setAttribute("x1", A[0]); ed.line.setAttribute("y1", A[1]); ed.line.setAttribute("x2", B[0]); ed.line.setAttribute("y2", B[1]);
    ed.line.style.strokeDashoffset = 1 - d;
    ed.line.style.opacity = d > 0 ? 1 : 0;
    const q = ((t - 11) * 0.8 + ed.k * 0.37) % 1;
    const dir = ed.k % 2 ? q : 1 - q;
    ed.pulse.setAttribute("cx", lerp(A[0], B[0], dir));
    ed.pulse.setAttribute("cy", lerp(A[1], B[1], dir));
    ed.pulse.style.opacity = pw * Math.sin(Math.PI * q);
  });

  /* composite graph label + glow */
  graphLbl.style.opacity = seg(t, 7.4, 7.9);
  graphLbl.textContent = t >= 10.9 ? "Composite graph: image + text" : "Image graph";
  graphLbl.style.fill = t >= 10.9 ? v("--fg") : v("--muted");
  platGlow.setAttribute("d", plat.getAttribute("d"));
  platGlow.style.opacity = pulse(t, 11.0, 1.0) + .8 * pulse(t, 12.0, 1.4);

  /* GNN block, fed by the composite graph */
  const ga = raw(t, 11.6, 12.0);
  GNN.setAttribute("transform", `translate(${GNX} ${(GNY + 24 * (1 - out(ga))).toFixed(1)}) scale(${(ga ? .9 + .1 * back(ga) : 0).toFixed(3)})`);
  GNN.style.opacity = ga;
  gHalo.style.opacity = .5 * Math.max(pulse(t, 12.1, 1.3), pulse(t, 13.0, .6));
  gLayers.forEach((b, i) => b.style.opacity = .3 + .7 * Math.max(pulse(t, 12.5 + i * .25, .5), pulse(t, 13.1 + i * .12, .4)));
  const srcs = [];
  for (let j = 0; j < 10; j++) srcs.push(j % 4 === 3 ? WP[j % 3][j % 2] : LAT[(j * 5) % 16]);
  stream.forEach((c, j) => {
    const s0 = 12.0 + j * 0.09, q = raw(t, s0, s0 + .7);
    const S0 = srcs[j], tx = GNX + 108, ty = GNY - 10 + (j % 5) * 5;
    const e2 = io(q);
    c.setAttribute("cx", lerp(S0[0], tx, e2)); c.setAttribute("cy", lerp(S0[1], ty, e2) - 50 * Math.sin(Math.PI * q));
    c.style.opacity = q > 0 && q < 1 ? 1 : 0;
  });
  gOut.style.opacity = raw(t, 13.3, 13.5);

  /* readout */
  const ra = seg(t, 13.4, 13.8);
  RO.setAttribute("transform", `translate(${MX} ${lerp(250, 236, ra)})`);
  RO.style.opacity = ra;
  const m = lerp(0.5, 0.88, out(raw(t, 13.8, 14.8))) + 0.02 * Math.sin((t - 13.8) * 14) * (1 - raw(t, 13.8, 15.0)) * (t > 13.8 ? 1 : 0);
  marker.setAttribute("transform", `translate(${20 + 240 * m} 0)`);
  fill.setAttribute("width", Math.max(0, 240 * (m - 0.5)));
  fill.setAttribute("x", 140);
  const vv = raw(t, 14.9, 15.3);
  verdict.style.opacity = vv;
  verdict.setAttribute("transform", `translate(212 30) scale(${vv ? back(vv).toFixed(3) : 0})`);
  lFake.style.fill = vv > 0 ? v("--alert") : v("--muted");
}

/* ---------- playback ---------- */
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t = reduce ? PL + 15.8 : 0.3, playing = !reduce, last = null, dragging = false;
scrub.max = TOT;
playBtn.textContent = playing ? "Pause" : "Play";
playBtn.addEventListener("click", () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; });
document.getElementById("restart").addEventListener("click", () => { t = 0; });
scrub.addEventListener("input", () => { t = +scrub.value; dragging = true; });
scrub.addEventListener("change", () => { dragging = false; });
function frame(now) {
  if (last !== null && playing && !dragging) t = (t + (now - last) / 1000) % TOT;
  last = now;
  render(t);
  if (!dragging) scrub.value = t;
  requestAnimationFrame(frame);
}
render(t);
requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  if (window.self === window.top) return;
  var last = 0;
  function post() {
    var h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height);
    if (h !== last) { last = h; parent.postMessage({ type: "anim-height", h: h }, "*"); }
  }
  new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  /* start from the beginning when scrolled into view; pause when off screen */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var play = document.getElementById("play"), restart = document.getElementById("restart");
  var seen = false, ours = false;
  var playing = function () { return play.textContent.trim() === "Pause"; };
  if (playing()) play.click();
  new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) {
        if (!seen) { seen = true; restart.click(); if (!playing()) play.click(); }
        else if (ours && !playing()) play.click();
        ours = false;
      } else if (playing()) { play.click(); ours = true; }
    });
  }, { threshold: 0.35 }).observe(document.querySelector(".stage"));
})();
</script>
