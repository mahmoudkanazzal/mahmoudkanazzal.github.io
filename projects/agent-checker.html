<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin: 0; background: #1e2124; }
html.embed .wrap { padding: 4px 0 8px !important; }
html.embed .wrap > header { display: none; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add("embed");</script>
</head>
<body>
<title>Agent Action Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: the agent's run as a row of 3D step blocks on a tilted floor, with the checker's map arcing above; risk meter and decision log on the right. */
:root {
  color-scheme: dark;
  --bg: #1e2124; --fg: #f2f2f2; --muted: #aeb3ba; --card: #262a2f; --line: #41464d; --edge: #6e757e; --panel: #2b2f35;
  --sky: #1c1f23; --floor: #24282d; --floor-c: #2f353d;
  --ink: #4a515c; --blk: #363b43; --blk-side: #1f2226; --blk-front: #2e3238;
  --blue: #4a86d6; --orange: #d97a3a; --green: #4bb578; --amber: #c9973f; --red: #dc5a5a; --cyan: #4aa8e0;
  --blue-soft: #25344a; --green-soft: #223a2d; --amber-soft: #3a3122; --red-soft: #40272a;
  --f-body: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, sans-serif;
}

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font: 700 13px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--red); margin: 0 0 8px; }
h1 { font: 700 clamp(28px, 4.2vw, 42px)/1.05 var(--f-body); margin: 0; text-wrap: balance; letter-spacing: -.01em; }

.acts { display: flex; gap: 28px; }
.act { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.tab { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--muted);
  font: 700 13px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.act.on .tab { color: var(--c); }
.act.on .tab::before { background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
.tab:focus-visible { outline: 2px solid var(--blue, var(--fg)); outline-offset: 4px; border-radius: 4px; }
.act.on .step .bar i { background: var(--c); }
.rail { display: grid; gap: 8px; }
.step { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--muted);
  font: 400 14px/1.25 var(--f-body); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.step .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.step .bar i { display: block; height: 100%; width: 0; background: var(--fg); border-radius: 4px; }
.step .lbl { display: flex; gap: 8px; align-items: baseline; }
.step b { font: 700 13px var(--f-body); }
.step.on { color: var(--fg); }
.step:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 4px; }
@media (max-width: 640px) { .step .txt { display: none; } }

.caption { font: 400 clamp(17px, 2.3vw, 21px)/1.35 var(--f-body); min-height: 2.7em; margin: 0; max-width: 72ch; }
.stage { overflow-x: auto; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
svg { display: block; width: 100%; min-width: 660px; height: auto; font-family: var(--f-body); }

.ctl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px;
  padding: 8px 16px; font: 700 14px var(--f-body); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, #scrub:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#scrub { flex: 1 1 200px; accent-color: var(--blue); min-width: 0; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Runtime action verification for LLM agents</p>
    <h1>How a checker stops a harmful agent action just before it runs</h1>
  </header>

  <div class="acts" id="acts"></div>
  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="stage"><svg id="svg" viewBox="0 0 1120 480" role="img" aria-label="Animation in two parts. The problem: an AI agent works through a task with tools, and an email it reads hides an attacker's instruction. Existing guards either compare actions with the user's request or ask another AI to judge, and both approve every step, including sending the account number to an unknown address, with no guarantee about false alarms on normal work. The solution: a checker keeps a connected map of the run showing order, which tool answered which request, and where earlier information reappears. Thresholds are set on harmless runs. Before each action the checker scores the path that led to it, with a score that only rises: paying a bill is allowed, sharing a file is held for review, and sending the account number is blocked before it runs."></svg></div>

  <div class="ctl">
    <button class="btn" id="play" type="button">Pause</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <input type="range" id="scrub" min="0" max="26" step="0.01" value="0" aria-label="Timeline">
  </div>
</div>

<script>
(() => {
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const LOOP = 26, END = 25.4;

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const raw = (t, a, b) => clamp((t - a) / (b - a));
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const pulse = (t, at, d = .7) => { const p = raw(t, at, at + d); return p > 0 && p < 1 ? Math.sin(Math.PI * p) : 0; };
const v = n => `var(${n})`;
const frac = x => x - Math.floor(x);
const rnd = i => frac(Math.sin(i * 91.7 + 3.3) * 43758.5453);
function el(tag, attrs = {}, parent = svg, style = {}) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  Object.assign(e.style, style);
  parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, size, style = {}, anchor = "start", bold = false) {
  const e = el("text", { x, y, "font-size": size, "text-anchor": anchor }, parent, Object.assign({ fontWeight: bold ? 700 : 400 }, style));
  e.textContent = s; return e;
}
const halo = { stroke: v("--card"), strokeWidth: 4, paintOrder: "stroke", strokeLinejoin: "round" };
function chipG(parent, label, color, w0) {
  const g = el("g", {}, parent);
  const w = w0 || label.length * 7.2 + 26;
  const r = el("rect", { x: -w / 2, y: -13, width: w, height: 26, rx: 13 }, g, { fill: v(color) });
  const tt = txt(g, 0, 5, label, 14, { fill: "#fff" }, "middle", true);
  return Object.assign(g, { r, tt });
}

/* ---------- story ---------- */
const STAGES = [
  { t: 0,    name: "Untrusted inputs", cap: "An AI agent completes a task step by step with tools. Any content it reads, even the request itself, may hide an attacker's instructions, so nothing is trusted." },
  { t: 5.2,  name: "Map the run",      cap: "A lightweight checker keeps a connected map of the run: what came before what, which tool answered which request, and where earlier information reappears." },
  { t: 8.4,  name: "Set thresholds",   cap: "Its thresholds are set in advance on normal, harmless runs, so legitimate work is rarely interrupted." },
  { t: 11.2, name: "Check each action", cap: "Before each action runs, the checker scores it from the path that led to it. The score only accumulates: once a warning appears, it stays." },
  { t: 18.6, name: "Stop the harm",    cap: "The harmful step is judged by the path behind it, not by what the agent was told to do, and it is stopped just before it happens." },
];

/* ---------- 3D camera ---------- */
const CX = 378, CY = 296, SC = 1.0, F = 1100, PHI = .5, cph = Math.cos(PHI), sph = Math.sin(PHI);
let cth = 1, sth = 0;
function P(X, Y, Z) {
  const xr = X * cth + Z * sth, zr = -X * sth + Z * cth;
  const zz = zr * cph + Y * sph, k = F / (F - zz);
  return [CX + xr * k * SC, CY + (zr * sph - Y * cph) * k * SC, k * SC, zz];
}
const poly = pts => "M " + pts.map(q => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L ") + " Z";

/* ---------- run data ---------- */
const STEPS = [
  { x: -312, label: "your request", icon: "user" },
  { x: -208, label: "read inbox",    icon: "mail", tool: true, at: 1.4 },
  { x: -104, label: "open bill.pdf", icon: "doc",  tool: true, at: 2.9 },
  { x: 0,    label: "check account", icon: "bank", tool: true, at: 4.2 },
  { x: 104,  label: "pay bill",      icon: "card", tool: true, prop: 11.4, decide: 13.0, kind: "allow",  score: .12, from: [[2, 4], [3, 4]] },
  { x: 208,  label: "share file",    icon: "share", tool: true, prop: 14.3, decide: 15.9, kind: "review", score: .48, from: [[1, 5]] },
  { x: 312,  label: "send message",  icon: "send", tool: true, prop: 18.8, decide: 21.0, kind: "block",  score: .86, from: [[3, 6], [1, 6]] },
];
const REUSE_EARLY = [[1, 2]];
const TH = { review: .35, block: .7 };
const KC = { allow: "--green", review: "--amber", block: "--red" };
const KS = { allow: "--green-soft", review: "--amber-soft", block: "--red-soft" };
const KL = { allow: "allow", review: "review", block: "blocked" };
const AG = [[.5, 0], [.8, 1], [2.3, 2], [3.6, 3], [13.6, 4], [17.4, 5]];

/* ---------- layers + defs ---------- */
const defs = el("defs");
const root = el("g");
const L = {};
["sky", "floor", "order", "obj", "arcs", "fx", "hud", "panels"].forEach(k => L[k] = el("g", {}, root));
function lgrad(id, stops) {
  const g = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  stops.forEach(([o, c, op]) => el("stop", { offset: o }, g, { stopColor: v(c), stopOpacity: op }));
}
lgrad("skyG", [[0, "--sky", 1], [1, "--card", 1]]);
lgrad("beam", [[0, "--blue", 0], [.5, "--blue", .35], [1, "--blue", 0]]);
{ const g = el("radialGradient", { id: "floorG", cx: "50%", cy: "50%", r: "60%" }, defs);
  el("stop", { offset: 0 }, g, { stopColor: v("--floor-c") }); el("stop", { offset: 1 }, g, { stopColor: v("--floor") }); }
function rgrad(id, c) {
  const g = el("radialGradient", { id, cx: "35%", cy: "30%", r: "80%" }, defs);
  el("stop", { offset: "0" }, g, { stopColor: "#fff", stopOpacity: .9 });
  el("stop", { offset: "0.35" }, g, { stopColor: v(c) });
  el("stop", { offset: "1" }, g, { stopColor: v(c) });
}
["blue", "green", "amber", "red", "orange", "cyan"].forEach(c => rgrad("g-" + c, "--" + c));
const sh = el("filter", { id: "sh", x: "-20%", y: "-20%", width: "140%", height: "150%" }, defs);
el("feDropShadow", { dx: 0, dy: 6, stdDeviation: 6, "flood-color": "#0a0f24", "flood-opacity": .18 }, sh);
el("rect", { x: 0, y: 0, width: 800, height: 480 }, L.sky, { fill: "url(#skyG)" });
const floorP = el("path", {}, L.floor, { fill: "url(#floorG)", stroke: v("--line"), strokeWidth: 1.5 });

/* ---------- icons (white line icons, local) ---------- */
function icon(g, kind, color = "#fff") {
  const s = { fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  if (kind === "user") { el("circle", { cx: 0, cy: -3, r: 3.6 }, g, s); el("path", { d: "M -6.5 6 A 6.5 5.5 0 0 1 6.5 6" }, g, s); }
  if (kind === "mail") { el("rect", { x: -8, y: -6, width: 16, height: 12, rx: 2 }, g, s); el("path", { d: "M -8 -5 L 0 1 L 8 -5" }, g, s); }
  if (kind === "doc") { el("path", { d: "M -6 -8 L 3 -8 L 6 -5 L 6 8 L -6 8 Z M -3 -2 L 3 -2 M -3 2 L 3 2" }, g, s); }
  if (kind === "bank") { el("path", { d: "M -8 -2 L 0 -8 L 8 -2 Z M -6 -1 L -6 6 M -2 -1 L -2 6 M 2 -1 L 2 6 M 6 -1 L 6 6 M -8 7 L 8 7" }, g, s); }
  if (kind === "card") { el("rect", { x: -8, y: -6, width: 16, height: 12, rx: 2 }, g, s); el("path", { d: "M -8 -2 L 8 -2 M -5 3 L -1 3" }, g, s); }
  if (kind === "share") { [[-6, 0], [5, -6], [5, 6]].forEach(([x, y]) => el("circle", { cx: x, cy: y, r: 2.4 }, g, s)); el("path", { d: "M -4 -1 L 3 -5 M -4 1 L 3 5" }, g, s); }
  if (kind === "send") { el("path", { d: "M -8 0 L 8 -7 L 3 8 L 0 2 Z M 0 2 L 8 -7" }, g, s); }
}

/* ---------- step blocks ---------- */
function block(g, front, top, side, stroke) {
  const W = 30, H = 22, D = 12;
  const parts = {};
  parts.side = el("path", { d: `M ${W} ${-H} L ${W + 10} ${-H - D} L ${W + 10} ${-D} L ${W} 0 Z` }, g, { fill: v(side) });
  parts.top = el("path", { d: `M ${-W} ${-H} L ${-W + 10} ${-H - D} L ${W + 10} ${-H - D} L ${W} ${-H} Z` }, g, { fill: v(top), stroke: v(stroke), strokeWidth: 1.5, strokeLinejoin: "round" });
  parts.front = el("rect", { x: -W, y: -H, width: 2 * W, height: H, rx: 3 }, g, { fill: v(front), stroke: v(stroke), strokeWidth: 1.5 });
  return parts;
}
STEPS.forEach((s, i) => {
  s.g = el("g", {}, L.obj);
  s.halo = el("ellipse", { cx: 5, cy: -2, rx: 50, ry: 16 }, s.g, { fill: v("--blue"), opacity: 0 });
  s.shadow = el("ellipse", { cx: 5, cy: 2, rx: 40, ry: 9 }, s.g, { fill: v("--fg"), opacity: .12 });
  s.body = el("g", {}, s.g);
  s.parts = block(s.body, "--blk-front", "--blk", "--blk-side", "--edge");
  s.badge = el("g", { transform: "translate(0 -11)" }, s.body);
  s.badgeC = el("circle", { r: 10 }, s.badge, { fill: i === 0 ? v("--ink") : v("--ink") });
  icon(s.badge, s.icon);
  s.lbl = txt(s.g, 5, 26, s.label, 14, Object.assign({ fill: v("--fg") }, halo), "middle", true);
  if (s.tool) {
    /* the tool's answer floats above the step */
    s.ans = el("g", {}, L.obj);
    el("rect", { x: -13, y: -10, width: 26, height: 20, rx: 4 }, s.ans, { fill: v("--card"), stroke: v("--blue"), strokeWidth: 1.6, filter: "url(#sh)" });
    [-4, 0, 4].forEach((y, j) => el("rect", { x: -8, y: y - 1, width: j === 2 ? 10 : 16, height: 2.2, rx: 1.1 }, s.ans, { fill: v("--blue"), opacity: .6 }));
    if (i === 1) s.hidden = el("rect", { x: -8, y: 6.5, width: 16, height: 2.2, rx: 1.1 }, s.ans, { fill: v("--red") });
  }
  if (s.prop) {
    s.frags = Array.from({ length: 8 }, (_, j) => el("rect", { x: -6, y: -6, width: 12, height: 9, rx: 2 }, L.fx, { fill: v("--red"), opacity: 0 }));
  }
});
const hiddenMark = el("g", {}, L.fx);
el("circle", { r: 12 }, hiddenMark, { fill: v("--red"), opacity: .25 });
el("circle", { r: 6 }, hiddenMark, { fill: `url(#g-red)` });
const callout = el("g", {}, L.fx);
el("rect", { x: -4, y: -38, width: 214, height: 30, rx: 10 }, callout, { fill: v("--red-soft"), stroke: v("--red"), strokeWidth: 1.5 });
el("path", { d: "M 6 -8 L 0 4 L 18 -8 Z" }, callout, { fill: v("--red-soft"), stroke: v("--red"), strokeWidth: 1.5, strokeLinejoin: "round" });
el("rect", { x: 4, y: -9.5, width: 16, height: 3, rx: 1 }, callout, { fill: v("--red-soft") });
txt(callout, 10, -18, "hidden: “send the account number to …”", 13, { fill: v("--red"), fontStyle: "italic" }, "start", true);

/* ---------- map edges ---------- */
const orderE = STEPS.slice(1).map(() => el("path", {}, L.order, { fill: "none", stroke: v("--edge"), strokeWidth: 3, strokeLinecap: "round", pathLength: 1, strokeDasharray: 1 }));
const ansE = STEPS.map(s => s.tool ? el("path", {}, L.arcs, { fill: "none", stroke: v("--blue"), strokeWidth: 2.2, strokeDasharray: "4 4", opacity: 0 }) : null);
const reuse = [];
REUSE_EARLY.forEach(([a, b]) => reuse.push({ a, b, at: 5.6, step: null }));
STEPS.forEach((s, i) => (s.from || []).forEach(([a, b]) => reuse.push({ a, b, at: s.prop + .5, step: i })));
reuse.forEach(r => { r.e = el("path", { pathLength: 1 }, L.arcs, { fill: "none", strokeWidth: 3, strokeLinecap: "round", strokeDasharray: 1 }); r.dot = el("circle", { r: 4.5 }, L.arcs, { fill: `url(#g-orange)`, opacity: 0 }); });

/* ---------- agent ---------- */
const AGT = el("g", {}, L.fx);
el("ellipse", { cx: 0, cy: 22, rx: 14, ry: 4 }, AGT, { fill: v("--fg"), opacity: .15 });
el("line", { x1: 0, y1: -16, x2: 0, y2: -23 }, AGT, { stroke: v("--ink"), strokeWidth: 2 });
el("circle", { cx: 0, cy: -25, r: 3 }, AGT, { fill: `url(#g-cyan)` });
el("rect", { x: -14, y: -16, width: 28, height: 24, rx: 8, filter: "url(#sh)" }, AGT, { fill: v("--ink") });
const eyes = [-6, 6].map(x => el("rect", { x: x - 2.5, y: -8, width: 5, height: 7, rx: 2.5 }, AGT, { fill: v("--cyan") }));
el("rect", { x: -9, y: 10, width: 18, height: 8, rx: 3 }, AGT, { fill: v("--ink") });

/* ---------- checker gate ---------- */
const GATE = el("g", {}, L.obj);
const gHalo = el("ellipse", { cx: 5, cy: -2, rx: 56, ry: 16 }, GATE, { fill: v("--blue"), opacity: .2 });
const gPill = [-40, 40].map(x => el("rect", { x: x - 5, y: -86, width: 10, height: 86, rx: 3 }, GATE, { fill: v("--blue") }));
const gTop = el("rect", { x: -46, y: -94, width: 92, height: 12, rx: 4 }, GATE, { fill: v("--blue") });
const gBeam = el("rect", { x: -35, y: -60, width: 70, height: 26 }, GATE, { fill: "url(#beam)" });
const gBars = [-20, 0, 20].map(x => el("rect", { x: x - 3, y: -82, width: 6, height: 0, rx: 2 }, GATE, { fill: v("--red") }));
const gShield = el("g", { transform: "translate(0 -88)" }, GATE);
el("path", { d: "M 0 -9 L 8 -6 L 8 0 C 8 5 4 8 0 10 C -4 8 -8 5 -8 0 L -8 -6 Z" }, gShield, { fill: "#fff" });

const gChip = chipG(L.fx, "", "--green", 92);

/* ---------- HUD legend ---------- */
const LEG = el("g", { transform: "translate(22 22)" }, L.hud);
[["order", "--edge", false], ["tool answer", "--blue", true], ["info reused", "--orange", false]].forEach(([s, c, dash], i) => {
  const g = el("g", { transform: `translate(${[0, 80, 186][i]} 0)` }, LEG);
  el("rect", { x: 0, y: -12, width: [72, 98, 104][i], height: 26, rx: 13 }, g, { fill: v("--card"), stroke: v("--line"), filter: "url(#sh)" });
  el("line", { x1: 10, y1: 1, x2: 26, y2: 1 }, g, { stroke: v(c), strokeWidth: 3, strokeDasharray: dash ? "4 3" : "none", strokeLinecap: "round" });
  txt(g, 32, 5.5, s, 13.5, { fill: v("--fg") }, "start", true);
});

/* ---------- risk meter ---------- */
const MG = el("g", { transform: "translate(808 20)" }, L.panels);
el("rect", { x: 0, y: 0, width: 292, height: 272, rx: 16, filter: "url(#sh)" }, MG, { fill: v("--panel"), stroke: v("--line"), strokeWidth: 1.5 });
txt(MG, 16, 28, "Risk score", 16, { fill: v("--fg") }, "start", true);
txt(MG, 16, 46, "only goes up", 13, { fill: v("--muted") });
const TX0 = 40, TW = 34, TY0 = 72, TH_ = 170, TB = TY0 + TH_;
const yOf = s => TB - TH_ * s;
el("rect", { x: TX0, y: TY0, width: TW, height: TH_ }, MG, { fill: v("--line") });
el("ellipse", { cx: TX0 + TW / 2, cy: TB, rx: TW / 2, ry: 6 }, MG, { fill: v("--line") });
const mFill = el("rect", { x: TX0, width: TW }, MG, { fill: v("--green") });
const mBot = el("ellipse", { cx: TX0 + TW / 2, cy: TB, rx: TW / 2, ry: 6 }, MG, { fill: v("--green") });
const mTop = el("ellipse", { cx: TX0 + TW / 2, rx: TW / 2, ry: 6 }, MG, { fill: v("--green") });
const mTopH = el("ellipse", { cx: TX0 + TW / 2, rx: TW / 2, ry: 6 }, MG, { fill: "#fff", opacity: .35 });
el("rect", { x: TX0 + 5, y: TY0 + 4, width: 6, height: TH_ - 8, rx: 3 }, MG, { fill: "#fff", opacity: .3 });
el("ellipse", { cx: TX0 + TW / 2, cy: TY0, rx: TW / 2, ry: 6 }, MG, { fill: "none", stroke: v("--edge"), strokeWidth: 1.2 });
const ths = [["review", TH.review, "--amber"], ["block", TH.block, "--red"]].map(([n, val, c]) => {
  const g = el("g", {}, MG);
  el("line", { x1: TX0 - 6, x2: 132, y1: 0, y2: 0 }, g, { stroke: v(c), strokeWidth: 2, strokeDasharray: "5 4" });
  txt(g, 136, 4.5, n, 13.5, { fill: v(c) }, "start", true);
  return { g, val };

    gBeam.setAttribute("y", -82 + 60 * frac(t * 1.4));
    const close = s.kind === "block" ? out(raw(t, s.decide, s.decide + .3)) : 0;
    gBars.forEach(b => b.setAttribute("height", 82 * close));
    gChip.tt.textContent = decided ? KL[s.kind] : "checking…";
    gChip.r.style.fill = v(decided ? KC[s.kind] : "--blue");
    gChip.setAttribute("transform", `translate(${x.toFixed(1)} ${(y - 122 * k).toFixed(1)}) scale(${(Math.min(1, k) * (a ? 1 : 0)).toFixed(3)})`);
    gChip.style.opacity = a * (1 - leave) * raw(t, s.prop + .4, s.prop + .6);
    GATE.zz = zz + 1; if (a > 0) objs.push({ g: GATE, zz: zz + 1 });
  }
  objs.sort((a, b) => a.zz - b.zz).forEach(o => { L.obj.appendChild(o.g); if (o.ans) L.obj.appendChild(o.ans); });

  /* agent hops along completed steps */
  {
    let from = 0, to = 0, p = 1;
    for (let j = 0; j < AG.length; j++) {
      if (t >= AG[j][0]) { from = j > 0 ? AG[j - 1][1] : 0; to = AG[j][1]; p = raw(t, AG[j][0], AG[j][0] + .5); }
    }
    const xA = lerp(STEPS[from].x, STEPS[to].x, io(p));
    const hop = 40 * Math.sin(Math.PI * p);
    const blocked = t > STEPS[6].decide;
    const shake = blocked ? 3 * Math.sin(t * 30) * pulse(t, STEPS[6].decide + .1, .8) : 0;
    const [ax, ay, ak] = P(xA - 8, 58 + hop + 3 * Math.sin(t * 3), 22);
    AGT.setAttribute("transform", `translate(${(ax + shake).toFixed(1)} ${ay.toFixed(1)}) scale(${(ak * raw(t, .5, .8)).toFixed(3)})`);
    AGT.style.opacity = raw(t, .5, .8);
    const blink = frac(t * .4) < .04 ? .15 : 1;
    eyes.forEach(e => { e.setAttribute("height", 7 * blink); e.style.fill = blocked && t < STEPS[6].decide + 1.4 ? v("--red") : v("--cyan"); });
  }

  /* HUD */
  LEG.style.opacity = raw(t, 5.4, 5.9);

  /* meter */
  MG.style.opacity = .4 + .6 * raw(t, 8.4, 8.7);
  const yS = yOf(score);
  mFill.setAttribute("y", yS); mFill.setAttribute("height", TB - yS);
  mTop.setAttribute("cy", yS); mTopH.setAttribute("cy", yS);
  [mFill, mBot, mTop].forEach(e => e.style.fill = v(zoneCol));
  mTop.style.opacity = mBot.style.opacity = mFill.style.opacity = score > .005 ? 1 : 0;
  mTopH.style.opacity = score > .005 ? .35 : 0;
  runs.forEach((r, i) => {
    const q = raw(t, 8.7 + i * .1, 9.0 + i * .1);
    r.setAttribute("cy", lerp(TY0, yOf(runVals[i]), out(q)));
    r.style.opacity = q * (1 - .5 * raw(t, 11.0, 11.4));
  });
  runsLbl.style.opacity = raw(t, 8.7, 9.0) * (1 - .5 * raw(t, 11.0, 11.4));
  ths.forEach((th, i) => {
    const q = io(raw(t, 9.9 + i * .3, 10.6 + i * .3));
    th.g.setAttribute("transform", `translate(0 ${lerp(TY0 - 10, yOf(th.val), q).toFixed(1)})`);
    th.g.style.opacity = raw(t, 9.9 + i * .3, 10.1 + i * .3);
  });
  setTag.setAttribute("transform", `translate(${86} ${yOf(TH.block) - 30})`);
  setTag.style.opacity = 0;
  scoreT.textContent = score.toFixed(2);
  scoreT.style.fill = v(zoneCol);
  scoreT.style.opacity = raw(t, 11.2, 11.5);
  let lastDec = null; STEPS.forEach(s => { if (s.prop && t >= s.decide) lastDec = s; });
  if (cur >= 0 && t < STEPS[cur].decide) { decChip.tt.textContent = "checking…"; decChip.r.style.fill = v("--blue"); decChip.style.opacity = raw(t, STEPS[cur].prop + .4, STEPS[cur].prop + .6); }
  else if (lastDec) { decChip.tt.textContent = KL[lastDec.kind]; decChip.r.style.fill = v(KC[lastDec.kind]); decChip.style.opacity = 1; }
  else decChip.style.opacity = 0;
  const dp = lastDec ? pulse(t, lastDec.decide, .5) : 0;
  decChip.setAttribute("transform", `translate(234 140) scale(${(1 + .12 * dp).toFixed(3)})`);

  /* decision log */
  DG.style.opacity = .4 + .6 * raw(t, 11.2, 11.5);
  logRows.forEach(r => {
    const q = raw(t, r.s.decide + .1, r.s.decide + .4);
    r.g.style.opacity = q;
  });
}

/* ---------- playback ---------- */
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t = reduce ? PL - S0 + 23 : 0.2, playing = !reduce, last = null, dragging = false;
scrub.max = TOT;
playBtn.textContent = playing ? "Pause" : "Play";
playBtn.addEventListener("click", () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; });
document.getElementById("restart").addEventListener("click", () => { t = 0; });
scrub.addEventListener("input", () => { t = +scrub.value; dragging = true; });
scrub.addEventListener("change", () => { dragging = false; });
function frame(now) {
  if (last !== null && playing && !dragging) t = (t + (now - last) / 1000) % TOT;
  last = now;
  render(t);
  if (!dragging) scrub.value = t;
  requestAnimationFrame(frame);
}
render(t);
requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  if (window.self === window.top) return;
  var last = 0;
  function post() {
    var h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height);
    if (h !== last) { last = h; parent.postMessage({ type: "anim-height", h: h }, "*"); }
  }
  new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  /* start from the beginning when scrolled into view; pause when off screen */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var play = document.getElementById("play"), restart = document.getElementById("restart");
  var seen = false, ours = false;
  var playing = function () { return play.textContent.trim() === "Pause"; };
  if (playing()) play.click();
  new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) {
        if (!seen) { seen = true; restart.click(); if (!playing()) play.click(); }
        else if (ours && !playing()) play.click();
        ours = false;
      } else if (playing()) { play.click(); ours = true; }
    });
  }, { threshold: 0.35 }).observe(document.querySelector(".stage"));
})();
</script>
</body>
