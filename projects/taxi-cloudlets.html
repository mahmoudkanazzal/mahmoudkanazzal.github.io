<div class="wrap">
  <header>
    <p class="eyebrow">NYC taxi demand and supply forecasting with GNNs</p>
    <h1>How semi-decentralized cloudlets make citywide taxi forecasts about 10× faster</h1>
  </header>

  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="ctl">
    <button class="btn" id="play" type="button">Pause</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <input type="range" id="scrub" min="0" max="24.5" step="0.01" value="0" aria-label="Timeline">

{ const g = el("radialGradient", { id: "heat", cx: "50%", cy: "50%", r: "50%" }, defs);

el("rect", { x: 0, y: 0, width: 800, height: 480 }, L.sky, { fill: "url(#skyG)" });
for (let i = 0; i < 40; i++) el("circle", { cx: rnd(i + 300) * 790, cy: rnd(i + 400) * 120, r: .6 + rnd(i + 500) * 1.1 }, L.sky, { fill: "#fff", opacity: .25 + .5 * rnd(i + 600) });
/* Manhattan skyline across the river */
{

  let pi = 0, cross = 0;
  E.forEach(e => {
    if (pi >= pool.length) return;
    const a = eyes[e.i], b = eyes[e.j];
    const ln = pool[pi++];
    let d;
    if (e.type === "dest") { const mx = (a[0] + b[0]) / 2, my = Math.min(a[1], b[1]) - 26; d = `M ${a[0]} ${a[1]} Q ${mx} ${my} ${b[0]} ${b[1]}`; }
    else d = `M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`;
    ln.setAttribute("d", d);
    const crossing = zoneOf(pos[e.i], bx, bz) !== zoneOf(pos[e.j], bx, bz);
    if (crossing) cross++;
    const fade = Math.min(pos[e.i].f, pos[e.j].f);
    let op = showType[e.type] * fade * (1 - .75 * Math.max(inCen, inP2P));
    let col = EC[e.type], w = e.type === "near" ? 1.8 : 2.2;
    if (inZon > 0) { if (crossing && t > 15.0) { col = "--red"; w = 3; op = Math.max(op, fade * raw(t, 15.0, 15.4)); } else op *= lerp(1, .25, inZon); }
    ln.style.stroke = v(col); ln.style.strokeWidth = w;
    ln.style.strokeDasharray = e.type === "dest" ? "5 4" : "none";
    ln.style.opacity = op;
  });
  for (; pi < pool.length; pi++) pool[pi].style.opacity = 0;

  const objs = [];
  TX.forEach((tx, i) => {
    const [x, y, k, zz] = scr[i], p = pos[i];
    tx.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(k * 1.15).toFixed(3)})`);
    const show = p.f * raw(t, .1 + i * .03, .4 + i * .03);
    tx.g.style.opacity = show;
    const px = -p.dz, pz = p.dx;
    const c0 = P(p.x + p.dx * 10 + px * 5, 0, p.z + p.dz * 10 + pz * 5), c1 = P(p.x + p.dx * 10 - px * 5, 0, p.z + p.dz * 10 - pz * 5);
    const c2 = P(p.x + p.dx * 58 - px * 18, 0, p.z + p.dz * 58 - pz * 18), c3 = P(p.x + p.dx * 58 + px * 18, 0, p.z + p.dz * 58 + pz * 18);
    tx.cone.setAttribute("d", poly([c0, c1, c2, c3]));
    tx.cone.style.opacity = show * .9;
    tx.pips.style.opacity = vis(t, 4.6 + i * .04, 7.2);
    let ringOp = 0, ringCol = "--amber";
    if (i === HL) ringOp = vis(t, 4.2, 7.2) * (.6 + .4 * Math.sin(t * 6));
    if (inZon > 0) { ringOp = Math.max(ringOp, inZon * .9); ringCol = ZC[zoneOf(p, bx, bz)]; }
    tx.ring.style.opacity = ringOp; tx.ring.style.stroke = v(ringCol);
    tx.zz = zz; objs.push(tx);
  });
  { const p = scr[HL], hb = vis(t, 4.2, 7.2);
    hlBeam.setAttribute("d", `M ${p[0] - 9} ${p[1] - 26} L ${p[0] + 9} ${p[1] - 26} L ${p[0] + 3} ${p[1] - 130} L ${p[0] - 3} ${p[1] - 130} Z`);
    hlBeam.style.opacity = .3 * hb; }
  /* passenger pings: where demand is about to appear */
  pings.forEach((pg, i) => {
    const [px, py, pk] = P(PINGS[i][0], 0, PINGS[i][1]);
    const on = vis(t, 4.4 + i * .12, 7.4);
    const ph = frac(t * .9 + i * .23);
    pg.a.setAttribute("cx", px); pg.a.setAttribute("cy", py);
    pg.a.setAttribute("rx", (6 + 22 * ph) * pk); pg.a.setAttribute("ry", (6 + 22 * ph) * pk * sph);
    pg.a.style.opacity = on * (1 - ph);
    pg.b.setAttribute("cx", px); pg.b.setAttribute("cy", py); pg.b.setAttribute("rx", 4 * pk); pg.b.setAttribute("ry", 4 * pk * sph);
    pg.b.style.opacity = on;
  });

  /* centralized */
  {
    const [x0, y, k, zz] = P(0, 0, 0);
    const a = raw(t, T_CEN[0], T_CEN[0] + .4) * (1 - raw(t, T_CEN[1] - .3, T_CEN[1]));
    const heat = raw(t, 8.0, 9.6);
    const x = x0 + Math.sin(t * 47) * 2.2 * heat;
    SRV.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(k * (a ? .85 + .15 * back(a) : 0)).toFixed(3)})`);
    SRV.g.style.opacity = a;
    SRV.heat.style.opacity = heat * (.7 + .3 * Math.sin(t * 9));
    SRV.alarm.style.opacity = heat > .3 ? (Math.sin(t * 14) > 0 ? 1 : .15) : 0;
    SRV.leds.forEach((l, j) => { l.style.fill = heat > .5 ? v("--red") : v("--mint"); l.style.opacity = .4 + .6 * frac(t * 3 + j * .37); });
    SRV.smoke.forEach((s2, j) => {
      const ph = frac(t * .55 + j * .2);
      s2.setAttribute("cx", 6 + 10 * Math.sin(ph * 5 + j)); s2.setAttribute("cy", -90 - 70 * ph); s2.setAttribute("r", 6 + 12 * ph);
      s2.style.opacity = heat * .35 * (1 - ph);
    });
    SRV.zz = zz + 30; if (a > 0) objs.push(SRV);
    const top = [x, y - 70 * k];
    upPool.forEach((ln, i) => {
      const p = eyes[i];
      const tw = inZon > 0 && t > 14.5;
      const z = zoneOf(pos[i], bx, bz);
      const target = tw ? (() => { const tp = P(TOWERS[z][0], 0, TOWERS[z][1]); return [tp[0], tp[1] - 60 * tp[2]]; })() : top;
      const op = tw ? raw(t, 14.5, 15.0) * pos[i].f : inCen * pos[i].f * raw(t, 7.3, 7.8);
      ln.setAttribute("x1", p[0]); ln.setAttribute("y1", p[1]); ln.setAttribute("x2", target[0]); ln.setAttribute("y2", target[1]);
      ln.style.opacity = op * (tw ? .5 : .45);
      ln.style.stroke = tw ? v(ZC[z]) : v("--steel");
      const d = upDots[i], back2 = tw && t > 18.2;
      const q = frac(t * (tw ? .7 : 1.1) + i * .13);
      const A = back2 ? target : p, B = back2 ? p : target;
      d.setAttribute("cx", lerp(A[0], B[0], q)); d.setAttribute("cy", lerp(A[1], B[1], q));
      d.style.fill = tw ? "#ffffff" : v("--steel");
      d.style.opacity = tw ? (t > 18.2 ? op : 0) : (t > 7.6 ? op : 0);
    });
    overChip.style.opacity = raw(t, 9.0, 9.3) * (1 - raw(t, T_CEN[1] - .3, T_CEN[1]));
    overChip.setAttribute("transform", `translate(${x.toFixed(1)} ${(y - 128 * k).toFixed(1)}) scale(${(1 + .06 * Math.sin(t * 10)).toFixed(3)})`);
    srvTag.setAttribute("transform", `translate(${(x + 2).toFixed(1)} ${(y - 102 * k).toFixed(1)})`);
    srvTag.style.opacity = a * (1 - raw(t, 9.0, 9.2));
  }

  /* decentralized */
  {
    let fi = 0;
    for (let i = 0; i < pos.length && fi < floodPool.length; i++) for (let j = i + 1; j < pos.length && fi < floodPool.length; j++) {
      if (pos[i].f < .3 || pos[j].f < .3) continue;
      if (Math.hypot(pos[i].x - pos[j].x, pos[i].z - pos[j].z) > 190) continue;
      const ln = floodPool[fi], a = eyes[i], b = eyes[j];
      ln.setAttribute("x1", a[0]); ln.setAttribute("y1", a[1]); ln.setAttribute("x2", b[0]); ln.setAttribute("y2", b[1]);
      ln.style.opacity = .5 * inP2P * raw(t, 10.6, 11.4);
      if (fi < floodDots.length) {
        const ph = frac(t * (.8 + rnd(fi) * .9) + rnd(fi + 5));
        const dd = floodDots[fi];
        dd.setAttribute("cx", lerp(a[0], b[0], ph)); dd.setAttribute("cy", lerp(a[1], b[1], ph));
        dd.style.opacity = inP2P * raw(t, 10.9, 11.6) * (fi < floodDots.length * raw(t, 10.9, 12.6) ? 1 : 0);
      }
      fi++;
    }
    for (; fi < floodPool.length; fi++) { floodPool[fi].style.opacity = 0; if (fi < floodDots.length) floodDots[fi].style.opacity = 0; }
    ranges.forEach((r, i) => {
      const c = scr[i], rr = (88 + 8 * Math.sin(t * 3 + i)) * c[2];
      r.setAttribute("cx", c[0]); r.setAttribute("cy", c[1]); r.setAttribute("rx", rr); r.setAttribute("ry", rr * sph);
      r.style.opacity = inP2P * raw(t, 10.5, 11.0) * pos[i].f;
    });
    const c = P(0, 0, -40);
    floodChip.setAttribute("transform", `translate(${c[0].toFixed(1)} ${(c[1] - 128).toFixed(1)})`);
    floodChip.style.opacity = raw(t, 12.0, 12.3) * (1 - raw(t, T_P2P[1] - .3, T_P2P[1]));
  }

  /* semi-decentralized */
  {
    const rects = [[-345, -225, bx, bz], [bx, -225, 345, bz], [-345, bz, bx, 225], [bx, bz, 345, 225]];
    zoneTiles.forEach((z, i) => {
      const [x0, z0, x1, z1] = rects[i];
      z.setAttribute("d", poly([[x0, z0], [x1, z0], [x1, z1], [x0, z1]].map(([x, zz]) => P(x, 1, zz))));
      z.style.opacity = .13 * inZon;
    });
    const b1 = [P(bx, 2, -225), P(bx, 2, 225)], b2 = [P(-345, 2, bz), P(345, 2, bz)];
    borders[0].setAttribute("d", `M ${b1[0][0]} ${b1[0][1]} L ${b1[1][0]} ${b1[1][1]}`);
    borders[1].setAttribute("d", `M ${b2[0][0]} ${b2[0][1]} L ${b2[1][0]} ${b2[1][1]}`);
    borders.forEach(b => { b.style.opacity = .7 * inZon; b.style.strokeWidth = 2.4 + 2.5 * pulse(t, 16.0, 1.4); b.style.strokeDashoffset = -t * 14; });
    TW.forEach((tw, i) => {
      const [x, y, k, zz] = P(tw.pos[0], 0, tw.pos[1]);
      const a = raw(t, 14.0 + i * .12, 14.5 + i * .12);
      tw.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(k * (a ? back(a) : 0)).toFixed(3)})`);
      tw.g.style.opacity = a;
      tw.glowE.setAttribute("rx", 34 + 6 * Math.sin(t * 3 + i));
      tw.waves.forEach((wv, j) => { const ph = frac(t * .8 + j * .5 + i * .17); wv.setAttribute("rx", 6 + 30 * ph); wv.setAttribute("ry", 2 + 10 * ph); wv.style.opacity = (1 - ph) * .9 * raw(t, 14.6, 15.0); });
      tw.zz = zz; if (a > 0) objs.push(tw);
      tw.top = [x, y - 64 * k];
      tw.tag.setAttribute("transform", `translate(${x.toFixed(1)} ${(y - 88 * k).toFixed(1)})`);
      tw.tag.style.opacity = raw(t, 14.6 + i * .1, 14.9 + i * .1);
    });
    towerLbl.setAttribute("x", TW[2].top[0]); towerLbl.setAttribute("y", P(TOWERS[2][0], 0, TOWERS[2][1])[1] + 26);
    towerLbl.style.opacity = raw(t, 14.6, 15.0) * (1 - raw(t, 18.6, 19.0));
    tLinks.forEach((lk, j) => {
      const A = TW[lk.a].top, B = TW[lk.b].top;
      const mx = (A[0] + B[0]) / 2, my = Math.min(A[1], B[1]) - 30;
      lk.e.setAttribute("d", `M ${A[0]} ${A[1]} Q ${mx} ${my} ${B[0]} ${B[1]}`);
      lk.e.style.opacity = .75 * raw(t, 17.4, 17.9);
      lk.e.style.strokeDashoffset = -t * 20;
      const q = frac(t * .6 + j * .25);
      lk.d.setAttribute("cx", (1 - q) * (1 - q) * A[0] + 2 * (1 - q) * q * mx + q * q * B[0]);
      lk.d.setAttribute("cy", (1 - q) * (1 - q) * A[1] + 2 * (1 - q) * q * my + q * q * B[1]);
      lk.d.style.opacity = raw(t, 17.6, 18.0);
    });
  }
  objs.sort((a, b) => a.zz - b.zz).forEach(o => L.obj.appendChild(o.g));

  /* HUD */
  LEG.style.opacity = raw(t, .6, 1.0) * (1 - raw(t, T_ZON + .6, T_ZON + 1.0));
  legItems.forEach((g, i) => g.style.opacity = [showType.road, showType.near, showType.dest][i]);
  cntT.textContent = `links crossing zones: ${cross}`;
  CNT.style.opacity = raw(t, 15.0, 15.4);

  /* forecast panel */
  FG.style.opacity = .4 + .6 * raw(t, 4.4, 4.8);
  frows.forEach((r, i) => {
    const q = out(raw(t, 4.8 + i * .4, 5.6 + i * .4));
    r.bar.setAttribute("width", 64 * (r.val / 5) * q);
    r.n.style.opacity = q;
  });
  fnote.style.opacity = raw(t, 5.8, 6.2);

  /* race panel: each setting crawls in its own step, then all three race at the end */
  RG.style.opacity = .4 + .6 * raw(t, 7.0, 7.3);
  const W = FIN - 20;
  const prog = [0, 0, 0];
  if (t < RACE) {
    prog[0] = t > 7.4 ? Math.min(.32, (t - 7.4) * .1) : 0;
    prog[1] = t > 10.8 ? Math.min(.27, (t - 10.8) * .083) : 0;
  } else {
    prog[0] = Math.min(1, (t - RACE) * .1);
    prog[1] = Math.min(1, (t - RACE) / 12);
    prog[2] = out(raw(t, RACE, RACE + 1.0));
  }
  lanes.forEach((ln, i) => {
    const shown = [7.0, 10.4, 13.6][i];
    ln.g.style.opacity = raw(t, shown, shown + .3) * (t < RACE - .2 || t > RACE ? 1 : 1 - raw(t, RACE - .2, RACE));
    ln.fill.setAttribute("width", W * prog[i]);
    const bob = Math.abs(Math.sin(t * 18 + i)) * (prog[i] > 0 && prog[i] < 1 ? 1.4 : 0);
    ln.car.setAttribute("transform", `translate(${16 + W * prog[i]} ${ln.y + 2 - bob}) scale(.85)`);
    let st = "";
    if (t >= shown) st = prog[i] >= 1 ? "done ✓" : (prog[i] > 0 ? "updating…" : "ready");
    const slow = i < 2 && t >= 12.8 && t < RACE;
    if (slow) st = "too slow";
    ln.status.textContent = st;
    ln.status.style.fill = prog[i] >= 1 ? v("--mint") : slow ? v("--red") : v("--muted");
    ln.status.style.fontWeight = slow ? 700 : 400;
  });
  const fq = raw(t, RACE + 1.1, RACE + 1.5);
  fast.style.opacity = fq;
  fast.setAttribute("transform", `translate(176 ${lanes[2].y + 30}) scale(${fq ? back(fq).toFixed(3) : 0})`);
}

/* ---------- playback ---------- */
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t = reduce ? 21.5 : .2, playing = !reduce, last = null, dragging = false;
playBtn.textContent = playing ? "Pause" : "Play";
playBtn.addEventListener("click", () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; });
document.getElementById("restart").addEventListener("click", () => { t = 0; });
scrub.addEventListener("input", () => { t = +scrub.value; dragging = true; });
scrub.addEventListener("change", () => { dragging = false; });
function frame(now) {
  if (last !== null && playing && !dragging) t = (t + (now - last) / 1000) % LOOP;
  last = now;
  render(t);
  if (!dragging) scrub.value = t;
  requestAnimationFrame(frame);
}
render(t);
requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  if (window.self === window.top) return;
  var last = 0;
  function post() {
    var h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height);
    if (h !== last) { last = h; parent.postMessage({ type: "anim-height", h: h }, "*"); }
  }
  new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  /* start from the beginning when scrolled into view; pause when off screen */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var play = document.getElementById("play"), restart = document.getElementById("restart");
  var seen = false, ours = false;
  var playing = function () { return play.textContent.trim() === "Pause"; };
  if (playing()) play.click();
  new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) {
        if (!seen) { seen = true; restart.click(); if (!playing()) play.click(); }
        else if (ours && !playing()) play.click();
        ours = false;
      } else if (playing()) { play.click(); ours = true; }
    });
  }, { threshold: 0.35 }).observe(document.querySelector(".stage"));
})();
</script>
</body>
