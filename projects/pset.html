<div class="wrap">
  <header>
    <p class="eyebrow">PSET · AAAI TAS 2026</p>
    <h1>Trusted warnings, untrusted context in mobile LLM agents</h1>
  </header>

  <div class="acts" id="acts"></div>
  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="stage"><svg id="svg" viewBox="0 0 1120 480" role="img" aria-label="Animation in two parts. The threat: an AI agent on a phone reads an ad and a planted message predicting a security warning and telling it to continue through it. When a genuine warning appears, an agent that follows the instruction crosses it. The PSET idea: PSET keeps a trusted record, outside the agent's context, of claims untrusted content makes about protected events that have not occurred. When a protected event matches a claim that prescribes crossing it, the crossing actions are removed from the agent's autonomous choices and the decision is escalated to the user. A prediction paired with a safe response creates no enforcement."></svg></div>

  <div class="ctl">
    <button class="btn" id="play" type="button">Pause</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <input type="range" id="scrub" min="0" max="32.2" step="0.01" value="0" aria-label="Timeline">
  </div>
</div>

const caption = document.getElementById("caption");

/* ---------- render ---------- */
function render(tt) {
  let si = 0; ALL.forEach((s, i) => { if (tt >= s.t) si = i; });
  ALL.forEach((s, i) => { s.b.querySelector("i").style.width = (raw(tt, s.t, s.end) * 100) + "%"; s.b.classList.toggle("on", i === si); });
  if (caption.dataset.i !== String(si)) { caption.dataset.i = si; caption.textContent = ALL[si].cap; }
  ACTS[0].box.classList.toggle("on", tt < PL);
  ACTS[1].box.classList.toggle("on", tt >= PL);
  const A2 = tt >= PL, u = tt - PL;
  root.style.opacity = raw(tt, 0, .5) * (1 - raw(tt, PL + END, TOT));

  const pin = out(raw(tt, 0, .6));

  beam.style.opacity = 0; ubeam.style.opacity = 0; ripple.style.opacity = 0; block.style.opacity = 0;
  if (tap) {
    const [t0, x, y, who] = tap, [gx, gy] = PG(x, y);
    const b = who === "u" ? ubeam : beam;
    const src = who === "u" ? [UX - 10, UY - 14] : [AX + 26, AY - 10];
    const reach = io(raw(tt, t0 - .35, t0));
    b.setAttribute("x1", src[0]); b.setAttribute("y1", src[1]);
    b.setAttribute("x2", lerp(src[0], gx, reach)); b.setAttribute("y2", lerp(src[1], gy, reach));
    b.style.opacity = 1 - raw(tt, t0 + .3, t0 + .55);
    b.style.strokeDashoffset = -tt * 30;
    const rp = raw(tt, t0, t0 + .5);

      block.setAttribute("transform", `translate(${x + 44} ${y - 4}) scale(${rp ? back(rp).toFixed(3) : 0})`);
      block.style.opacity = rp > 0 ? 1 - raw(tt, t0 + .4, t0 + .55) : 0;

    } else {
      beam.style.stroke = v("--cyan");
      ripple.setAttribute("cx", x); ripple.setAttribute("cy", y); ripple.setAttribute("r", 6 + 26 * rp);
      ripple.style.stroke = who === "u" ? v("--green") : v("--cyan");
      ripple.style.opacity = rp > 0 && rp < 1 ? 1 - rp : 0;

  }

  /* agent */
  const ag = raw(tt, .3, .8);
  const hop = 6 * Math.sin(tt * 2.2);
  AGT.setAttribute("transform", `translate(${AX} ${(AY + hop * .5).toFixed(1)}) scale(${ag ? back(ag).toFixed(3) : 0})`);
  AGT.style.opacity = ag;
  const primed = (!A2 && tt > 5.4 && tt < 11.5) || (A2 && u > 2.8 && u < 9.0);
  const fooled = !A2 && tt > 9.4 && tt < 11.5;
  eyes.forEach(e => { e.style.fill = fooled ? v("--red") : primed ? (frac(tt * 1.5) < .5 ? v("--red") : v("--cyan")) : v("--cyan"); e.setAttribute("height", frac(tt * .35) < .04 ? 2 : 13); });

  /* user (act 2) */
  const ua = A2 ? raw(u, 8.2, 8.6) * (1 - raw(u, 11.0, 11.4)) : 0;
  USR.style.opacity = ua;
  USR.setAttribute("transform", `translate(${UX} ${UY}) scale(${ua ? back(Math.min(1, ua)).toFixed(3) : 0})`);
  const aq = A2 ? raw(u, 8.5, 9.2) : 0;
  { const [sx, sy] = PG(0, 0), p = io(aq);
    ask.setAttribute("transform", `translate(${lerp(sx, UX, p).toFixed(1)} ${(lerp(sy, UY - 74, p) - 40 * Math.sin(Math.PI * p)).toFixed(1)}) scale(${lerp(.5, 1, p).toFixed(3)})`);
    ask.style.opacity = A2 ? raw(u, 8.5, 8.7) * (1 - raw(u, 10.4, 10.8)) : 0; }

    const c = CARD[k];

    const x0 = 34 - 40 * (1 - out(ai)), y0 = SLOT_Y[slot];
    const x = lerp(x0, AX - 20, f), y = lerp(y0, AY - 30, f) - 50 * Math.sin(Math.PI * f);
    c.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${lerp(1, .15, f).toFixed(3)})`);
    c.g.style.opacity = clamp(ai * 2) * (1 - raw(tt, tfly + .5, tfly + .7));
    const ty = raw(tt, tin + .3, tin + .3 + .9);
    const full = c.lines.join(""), n = Math.floor(full.length * ty);
    let used = 0; c.ls.forEach((e, i) => { e.textContent = c.lines[i].slice(0, Math.max(0, n - used)); used += c.lines[i].length; });
  });

  /* claims copied into the PSET record (act 2) */

  [[2.6, CARD.msg, 1, R1, "--purple"], [12.3, CARD.tip, 2, R2, "--green"]].forEach(([s0, c, slot, R, col]) => {
    if (!A2) return;
    const q = raw(u, s0, s0 + .9);
    if (q <= 0 || q >= 1) return;
    const x0 = 140, y0 = SLOT_Y[slot] + 30, x1 = 822, y1 = 228 + (R === R1 ? 98 : 182);
    const p = io(q);

  MEM.style.opacity = memIn;
  const mt = A2 ? [u > .4, u > 1.8, u > 3.1, u > 12.5] : [tt > .8, tt > 2.9, tt > 5.6, false];

  REC.style.opacity = A2 ? raw(u, .2, .6) : 0;
  R1.g.style.opacity = A2 ? raw(u, 3.4, 3.7) : 0;
  R2.g.style.opacity = A2 ? raw(u, 13.1, 13.4) : 0;
  R1.glowR.style.opacity = A2 ? Math.max(pulse(u, 3.4, .8), raw(u, 5.7, 6.0) * (1 - raw(u, 10.0, 10.4)), .8 * pulse(u, 15.9, 1.6)) : 0;
  R2.glowR.style.opacity = A2 ? Math.max(pulse(u, 13.1, .8), raw(u, 13.9, 14.2) * (1 - raw(u, 15.2, 15.6))) : 0;
  /* record matched to the live warning */
  if (A2 && u > 5.6 && u < 10.2) {
    const [dx, dy] = PG(76, -20);
    const q = io(raw(u, 5.7, 6.3));
    const sx = 822, sy = 228 + 98;

    recBeam.style.opacity = 1 - raw(u, 9.8, 10.2);
  } else if (A2 && u > 13.8 && u < 15.4) {
    const [dx, dy] = PG(76, -20), sx = 822, sy = 228 + 182, q = io(raw(u, 13.9, 14.4));
    recBeam.setAttribute("d", `M ${sx} ${sy} Q ${(sx + dx) / 2} ${Math.min(sy, dy) - 40} ${lerp(sx, dx, q)} ${lerp(sy, dy, q)}`);
    recBeam.style.stroke = v("--green");

  stamp.setAttribute("transform", `translate(${PX} ${(PY + 10 + 3 * pulse(tt, 11.08, .25)).toFixed(1)}) rotate(-10) scale(${lerp(1.8, 1, out(raw(tt, 10.8, 11.1))).toFixed(3)})`);
}

/* ---------- playback ---------- */
const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t = reduce ? PL + 10.6 : 0.2, playing = !reduce, last = null, dragging = false;
scrub.max = TOT;
playBtn.textContent = playing ? "Pause" : "Play";
playBtn.addEventListener("click", () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; });
document.getElementById("restart").addEventListener("click", () => { t = 0; });
scrub.addEventListener("input", () => { t = +scrub.value; dragging = true; });
scrub.addEventListener("change", () => { dragging = false; });
function frame(now) {
  if (last !== null && playing && !dragging) t = (t + (now - last) / 1000) % TOT;
  last = now;
  render(t);
  if (!dragging) scrub.value = t;
  requestAnimationFrame(frame);
}
render(t);
requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  if (window.self === window.top) return;
  var last = 0;
  function post() {
    var h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height);
    if (h !== last) { last = h; parent.postMessage({ type: "anim-height", h: h }, "*"); }
  }
  new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  /* start from the beginning when scrolled into view; pause when off screen */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var play = document.getElementById("play"), restart = document.getElementById("restart");
  var seen = false, ours = false;
  var playing = function () { return play.textContent.trim() === "Pause"; };
  if (playing()) play.click();
  new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (e.isIntersecting) {
        if (!seen) { seen = true; restart.click(); if (!playing()) play.click(); }
        else if (ours && !playing()) play.click();
        ours = false;
      } else if (playing()) { play.click(); ours = true; }
    });
  }, { threshold: 0.35 }).observe(document.querySelector(".stage"));
})();
</script>
